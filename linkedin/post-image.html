<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; }
  body {
    font-family: 'Heebo', sans-serif;
    background: #ffffff;
    position: relative;
    overflow: hidden;
    color: #11512b;
  }
  .wave {
    position: absolute; left: 0; bottom: 0; width: 1080px; height: 560px;
  }
  .accent { position: absolute; top: 0; right: 0; width: 34px; height: 270px; background: #217346; }
  h1 {
    position: absolute; top: 46px; right: 76px; left: 60px;
    font-size: 84px; font-weight: 800; white-space: nowrap; line-height: 1.06; letter-spacing: -1.5px;
    color: #11512b;
  }
  .fbar {
    position: absolute; top: 280px; left: 118px; width: 861px; height: 112px;
    background: #e3f0de; border: 4px solid #3f8a4f; border-radius: 22px;
    display: flex; align-items: center; direction: ltr;
  }
  .fbar .formula {
    flex: 1; text-align: center; font-size: 54px; font-weight: 500; color: #246435;
    direction: ltr; unicode-bidi: isolate;
  }
  .fbar .fx {
    width: 110px; height: 100%; border-left: 3px solid #3f8a4f;
    display: flex; align-items: center; justify-content: center;
    font-size: 52px; font-style: italic; color: #246435;
  }
  table {
    position: absolute; top: 455px; left: 101px; width: 878px;
    border-collapse: collapse; background: #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
    font-size: 35px; color: #111;
  }
  th { background: #1e5e33; color: #fff; font-weight: 700; height: 92px; }
  td { height: 84px; text-align: center; border-bottom: 2px solid #dcdcdc; border-left: 2px solid #dcdcdc; }
  td:last-child { border-left: none; }
  td.num { direction: ltr; }
  tr.north td { background: #f1f8ee; }
  tr.north td.hit { color: #1e5e33; font-weight: 700; }
  tr.total td {
    background: #e3f0de; color: #246435; font-weight: 800; font-size: 46px; height: 100px; border: none;
  }
  .total span.amt { direction: ltr; unicode-bidi: isolate; margin-right: 26px; }
  .arrow { position: absolute; top: 392px; left: 470px; width: 140px; height: 500px; }
  .footer {
    position: absolute; bottom: 26px; right: 60px; color: #fff; font-size: 30px; font-weight: 500;
  }
</style>
</head>
<body>
  <svg class="wave" viewBox="0 0 1080 560" preserveAspectRatio="none">
    <path d="M0 230 L1080 40 L1080 560 L0 560 Z" fill="#1e5e33"/>
    <path d="M0 330 L560 240 L560 560 L0 560 Z" fill="#164a28" opacity=".7"/>
    <g stroke="#2f7a45" stroke-width="2" opacity=".55">
      <line x1="0" y1="420" x2="560" y2="420"/><line x1="0" y1="470" x2="560" y2="470"/>
      <line x1="0" y1="520" x2="560" y2="520"/>
      <line x1="100" y1="320" x2="100" y2="560"/><line x1="220" y1="300" x2="220" y2="560"/>
      <line x1="340" y1="280" x2="340" y2="560"/><line x1="460" y1="260" x2="460" y2="560"/>
    </g>
  </svg>
  <div class="accent"></div>

  <h1>שעתיים ידנית<br>או 3 שניות בנוסחה אחת?</h1>

  <div class="fbar">
    <div class="formula">=SUMIFS(D:D, B:B, B2)</div>
    <div class="fx">fx</div>
  </div>

  <table>
    <tr><th>חודש</th><th>אזור</th><th>יחידות</th><th>מכירות</th></tr>
    <tr class="north"><td>ינואר</td><td class="hit">צפון</td><td class="num">120</td><td class="num hit">₪14,400</td></tr>
    <tr><td>פברואר</td><td>מרכז</td><td class="num">185</td><td class="num">₪22,200</td></tr>
    <tr class="north"><td>מרץ</td><td class="hit">צפון</td><td class="num">142</td><td class="num hit">₪17,040</td></tr>
    <tr><td>אפריל</td><td>דרום</td><td class="num">98</td><td class="num">₪11,760</td></tr>
    <tr class="total"><td colspan="4">סה״כ צפון <span class="amt">₪31,440</span></td></tr>
  </table>

  <div class="footer">רונן מערכות | קורס אקסל דיגיטלי</div>
</body>
</html>
