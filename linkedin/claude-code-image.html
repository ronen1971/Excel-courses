<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; }
  body {
    font-family: 'Heebo', sans-serif;
    background: #f6f2ea;
    position: relative; overflow: hidden; color: #1d1b18;
  }
  .kicker {
    position: absolute; top: 64px; right: 72px;
    font-size: 30px; font-weight: 700; color: #c2562f; letter-spacing: .5px;
  }
  h1 {
    position: absolute; top: 108px; right: 72px; left: 72px;
    font-size: 96px; font-weight: 900; line-height: 1.02; letter-spacing: -2px;
  }
  h1 em { font-style: normal; color: #c2562f; }
  .term {
    position: absolute; top: 380px; left: 72px; right: 72px; height: 600px;
    background: #1f1d1a; border-radius: 26px; overflow: hidden;
    box-shadow: 0 24px 50px rgba(40,30,20,.28);
  }
  .bar { height: 58px; background: #2c2925; display: flex; align-items: center; gap: 12px; padding: 0 26px; direction: ltr; }
  .dot { width: 18px; height: 18px; border-radius: 50%; }
  .bar .t { margin-left: 18px; color: #9b948a; font: 500 22px 'JetBrains Mono', monospace; }
  .prompt {
    direction: ltr; padding: 30px 40px 10px; color: #e9e4dc;
    font: 600 30px 'JetBrains Mono', monospace;
  }
  .prompt .c { color: #e0875f; }
  .prompt .q { font-family: 'Heebo', sans-serif; font-weight: 500; unicode-bidi: isolate; direction: rtl; display: inline-block; }
  ul { list-style: none; padding: 16px 40px 0; }
  li {
    display: flex; align-items: center; gap: 22px;
    color: #f3efe8; font-size: 36px; font-weight: 500; height: 74px;
    border-bottom: 1px solid #34302b;
  }
  li:last-child { border-bottom: none; }
  .ok {
    flex: 0 0 46px; height: 46px; border-radius: 12px; background: #3d8b5a;
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 30px; font-weight: 800;
  }
  .ok.no { background: #8a8277; }
  li .sub { color: #a49d92; font-size: 28px; font-weight: 400; margin-right: 8px; }
  .foot {
    position: absolute; bottom: 30px; right: 72px; font-size: 28px; font-weight: 500; color: #6b645a;
  }
</style>
</head>
<body>
  <div class="kicker">ניסוי קטן עם Claude Code</div>
  <h1>ביקשתי פוסט.<br><em>קיבלתי צוות.</em></h1>

  <div class="term">
    <div class="bar">
      <span class="dot" style="background:#e5654b"></span>
      <span class="dot" style="background:#e3b341"></span>
      <span class="dot" style="background:#4fb56b"></span>
      <span class="t">claude-code</span>
    </div>
    <div class="prompt"><span class="c">&gt;</span> <span class="q">"תבנה לי פוסט ויראלי שמתאים ליכולות שלי"</span></div>
    <ul>
      <li><span class="ok">✓</span>קרא את האתר שלי<span class="sub">והבין מי הקהל</span></li>
      <li><span class="ok">✓</span>כתב 3 גרסאות לפוסט</li>
      <li><span class="ok">✓</span>עיצב תמונה ב-Canva</li>
      <li><span class="ok">✓</span>תפס באג: הנוסחה התהפכה בעברית<span class="sub">ותיקן</span></li>
      <li><span class="ok">✓</span>שמר הכל ב-GitHub</li>
      <li><span class="ok no">✗</span>לא העלה ללינקדאין<span class="sub">ואמר את זה בכנות</span></li>
    </ul>
  </div>

</body>
</html>
