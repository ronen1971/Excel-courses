<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מעבדת אקסל | רונן מערכות</title>
  <meta name="description" content="אפליקציית תרגול חינמית באקסל: 10 תרגילים אינטראקטיביים בעברית, כותבים נוסחאות אמיתיות ומקבלים בדיקה מיידית.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <a href="../" class="brand"><span class="logo-mark">X</span> מעבדת אקסל <small>רונן מערכות</small></a>
    <div class="progress" aria-label="התקדמות">
      <span id="progressText">0 / 10</span>
      <div class="bar"><div id="progressFill"></div></div>
    </div>
    <a href="../#contact" class="btn btn-small">לקורס המלא</a>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="רשימת תרגילים">
      <h2>תרגילים</h2>
      <ol id="list"></ol>
      <button class="link-btn" id="reset">איפוס התקדמות</button>
    </aside>

    <main class="stage">
      <div class="card">
        <div class="meta"><span id="level" class="chip"></span><span id="counter"></span></div>
        <h1 id="title"></h1>
        <p id="task" class="task"></p>
      </div>

      <div class="formula-bar" dir="ltr">
        <span class="fx">fx</span>
        <span id="cellName" class="cell-name">—</span>
        <code id="formulaText"></code>
        <span id="liveResult" class="live"></span>
      </div>

      <div class="sheet-wrap"><table id="sheet" dir="ltr" aria-label="גיליון אקסל"></table></div>
      <p class="tip">לחצו על תא מסומן בירוק, הקלידו נוסחה שמתחילה ב-<bdi>=</bdi> ולחצו Enter.</p>

      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

      <div class="actions">
        <button class="btn btn-primary" id="check">בדיקה</button>
        <button class="btn btn-outline" id="hint">רמז</button>
        <button class="btn btn-outline" id="solution">הצגת פתרון</button>
        <button class="btn btn-ghost" id="next" hidden>לתרגיל הבא ←</button>
      </div>
    </main>
  </div>

  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
